# In a disconnected environment set global.imageRegistry to your mirror, e.g.
# registry.example.internal:5000. It is prepended to both images below.
global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  repository: ghcr.io/roiblum1/aigw-ui
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Keep this at 1. More replicas work but each one polls and syncs every cluster.
replicaCount: 1

config:
  # How often clusters are polled for models. "0" turns polling off.
  discoveryInterval: 60s
  # Apply changes to the clusters about a second after each edit.
  autoSync: true
  # How often every cluster is synced again without a change, to retry failed
  # syncs and undo manual edits. "0" turns it off. Needs autoSync.
  syncInterval: 5m
  # For models that serve a spent budget as best-effort: how often the usage
  # counters are read, and the share of its budget a tenant has to have used
  # to be moved (0.5 to 1). Needs redis.url.
  overageInterval: 15s
  overageThreshold: "0.9"
  # How often the usage counters are read to keep the usage history, which
  # the charts and the tenants' own page show. "0" keeps none. Needs redis.url.
  usageHistoryInterval: 1m
  # Lets a tenant open /my-usage and sign in with one of its API keys to see
  # its own budgets and usage. It sees nothing of another tenant.
  tenantPage: true
  # The priority of the request class "best-effort", which the hub creates
  # next to each model's InferencePool for a model in best-effort mode. A
  # request without a class has priority 0. It has an effect only on a site
  # whose scheduler acts on priorities; see docs/optimization.md.
  bestEffortPriority: -1

# Capacity measurements: AIPerf in a Job on an LLM cluster, aimed at one pod
# of a model. The LLM clusters pull this image, so it must be in a registry
# they reach. Empty turns measurements off. Build it from
# deploy/aiperf/Containerfile; the offline bundle does.
capacity:
  image: ""
  # When the hub measures by itself every LLMInferenceService that is not
  # measured or whose result is stale, drained, one per site and per model at
  # a time: once a week, such as "Fri 22:00 - Sat 06:00 Asia/Jerusalem", or
  # every day, such as "01:00 - 05:00 UTC". Empty never.
  window: ""
  # Measure prefill/decode LLMInferenceServices. Their Jobs run in the
  # gateway's namespace with the site's peer client certificate mounted,
  # which reaches every model on the peer listener with no key and no quota,
  # and the hub then needs to create Jobs there, which lets it mount any
  # Secret of that namespace. See docs/security.md before turning it on.
  peerMeasurements: false

# The tokens the hub signs, which tenants paste as their API keys. The
# gateways check them against the hub's public keys, which every sync writes
# into their SecurityPolicy. Changing issuer or audience refuses every token
# issued before; set them once.
tokens:
  issuer: aigw-ui
  audience: aigw-fleet
  # How long a token created on a tenant's page lasts. It carries the
  # tenant's budget across models and models as they were when it was made:
  # a change reaches the gateway with the tenant's next token.
  lifetimeDays: 180
  # How long a token a personal key gets lasts. The helper gets a new one
  # long before, so this is how long users go on while the hub cannot be
  # reached, and how long a token with an older budget can be held back from
  # renewal.
  renewedLifetimeHours: 168

# What every site's entry route has in common. Leave domain and peerSNI empty
# if the hub should not render entry routes.
fleet:
  # The sites' listener for requests from other sites answers as
  # peers.llm.<domain>. Set peerSNI to use another name.
  domain: ""
  peerSNI: ""
  # In each cluster's gateway namespace: the CA that signed the sites' peer
  # certificates, and the certificate a gateway presents to another site.
  peerCAConfigMap: llm-peer-ca
  peerClientSecret: llm-peer-client
  # Requests with the same value in one of these headers go to the same site.
  # One name per kind of client, separated by commas.
  sessionHeader: x-claude-code-session-id,x-openwebui-chat-id

# The admin token and the encryption key.
auth:
  # Name of a Secret you created with the keys "admin-token" and
  # "encryption-key" (32 bytes, base64: openssl rand -base64 32).
  # Leave empty and the chart generates both once and keeps them on upgrade.
  #
  # The encryption key protects the kubeconfigs and tenant API keys stored in
  # Postgres. If it is lost they cannot be read again. Back it up.
  existingSecret: ""

postgresql:
  # true runs a single Postgres inside the release. false uses externalDatabase.
  enabled: true
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: latest
    pullPolicy: IfNotPresent
  database: aigw
  username: aigw
  storage:
    size: 5Gi
    # Empty uses the cluster's default storage class.
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

externalDatabase:
  # Secret with the key "url" holding postgres://user:password@host:5432/dbname
  existingSecret: ""

# The Redis that the gateways' quota rate limit services count tokens in. It
# is only read, to show live usage per tenant. Leave url and existingSecret
# empty to turn usage monitoring off.
redis:
  # redis://[:password@]host:6379 for a Service in the cluster, or
  # rediss://[:password@]<route host>:443 for Redis behind an OpenShift Route.
  # A Route only carries TLS, so Redis itself must serve TLS and the Route
  # must use passthrough termination.
  url: ""
  # Name of a Secret with the key "url", instead of url above.
  existingSecret: ""
  # Name of a Secret or ConfigMap with the key "ca.crt": the CA that signed
  # the Redis certificate. Not needed when a public CA signed it.
  caSecret: ""
  caConfigMap: ""
  # Skip verification of the Redis certificate. For tests only.
  tlsInsecure: false
  # The rate limit service's CACHE_KEY_PREFIX, if you set one.
  keyPrefix: ""
  # Allow an admin to reset a tenant's usage on a model. This deletes the
  # counter in Redis, so the Redis user needs DEL. Off, Redis is only read.
  allowReset: false
  # Have the gateways count each tenant's requests and input, cached and
  # output tokens by model, an hour at a time, for the tenant's own page.
  # Four rules in the hub's BackendTrafficPolicy on the client listener,
  # which never refuse a request. Needs Envoy Gateway's global rate limiting,
  # as budgets across models do, and tenants on tokens.
  tokenCounts: true

route:
  enabled: true
  # Empty lets OpenShift pick <name>-<namespace>.<apps domain>.
  host: ""
  # edge: the router terminates TLS with its own certificate.
  termination: edge

# Only pods of this release may reach Postgres.
networkPolicy:
  enabled: true

# The server keeps its heap to 90% of the memory limit (MEMORY_LIMIT, set
# from it). It used 45 to 60 MiB with 1,000 tenants. It writes to several
# clusters and reads Postgres side by side; no CPU limit, so it is never
# throttled.
resources:
  requests: { cpu: 250m, memory: 128Mi }
  limits: { memory: 1Gi }

nodeSelector: {}
tolerations: []
