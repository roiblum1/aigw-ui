# In a disconnected environment set global.imageRegistry to your mirror, e.g.
# registry.example.internal:5000. It is prepended to both images below.
global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  repository: ghcr.io/roiblum1/aigw-ui
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Keep this at 1. More replicas work but each one polls and syncs every cluster.
replicaCount: 1

config:
  # How often clusters are polled for models. "0" turns polling off.
  discoveryInterval: 60s
  # Apply changes to the clusters about a second after each edit.
  autoSync: true
  # How often every cluster is synced again without a change, to retry failed
  # syncs and undo manual edits. "0" turns it off. Needs autoSync.
  syncInterval: 5m
  # For models that serve a spent budget as best-effort: how often the usage
  # counters are read, and the share of its budget a tenant has to have used
  # to be moved (0.5 to 1). Needs redis.url.
  overageInterval: 15s
  overageThreshold: "0.9"

# What every site's entry route has in common. Leave domain and peerSNI empty
# if the hub should not render entry routes.
fleet:
  # The sites' listener for requests from other sites answers as
  # peers.llm.<domain>. Set peerSNI to use another name.
  domain: ""
  peerSNI: ""
  # In each cluster's gateway namespace: the CA that signed the sites' peer
  # certificates, and the certificate a gateway presents to another site.
  peerCAConfigMap: llm-peer-ca
  peerClientSecret: llm-peer-client
  # Requests with the same value in one of these headers go to the same site.
  # One name per kind of client, separated by commas.
  sessionHeader: x-claude-code-session-id,x-openwebui-chat-id

# The admin token and the encryption key.
auth:
  # Name of a Secret you created with the keys "admin-token" and
  # "encryption-key" (32 bytes, base64: openssl rand -base64 32).
  # Leave empty and the chart generates both once and keeps them on upgrade.
  #
  # The encryption key protects the kubeconfigs and tenant API keys stored in
  # Postgres. If it is lost they cannot be read again. Back it up.
  existingSecret: ""

postgresql:
  # true runs a single Postgres inside the release. false uses externalDatabase.
  enabled: true
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: latest
    pullPolicy: IfNotPresent
  database: aigw
  username: aigw
  storage:
    size: 5Gi
    # Empty uses the cluster's default storage class.
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

externalDatabase:
  # Secret with the key "url" holding postgres://user:password@host:5432/dbname
  existingSecret: ""

# The Redis that the gateways' quota rate limit services count tokens in. It
# is only read, to show live usage per tenant. Leave url and existingSecret
# empty to turn usage monitoring off.
redis:
  # redis://[:password@]host:6379 for a Service in the cluster, or
  # rediss://[:password@]<route host>:443 for Redis behind an OpenShift Route.
  # A Route only carries TLS, so Redis itself must serve TLS and the Route
  # must use passthrough termination.
  url: ""
  # Name of a Secret with the key "url", instead of url above.
  existingSecret: ""
  # Name of a Secret or ConfigMap with the key "ca.crt": the CA that signed
  # the Redis certificate. Not needed when a public CA signed it.
  caSecret: ""
  caConfigMap: ""
  # Skip verification of the Redis certificate. For tests only.
  tlsInsecure: false
  # The rate limit service's CACHE_KEY_PREFIX, if you set one.
  keyPrefix: ""
  # Allow an admin to reset a tenant's usage on a model. This deletes the
  # counter in Redis, so the Redis user needs DEL. Off, Redis is only read.
  allowReset: false

route:
  enabled: true
  # Empty lets OpenShift pick <name>-<namespace>.<apps domain>.
  host: ""
  # edge: the router terminates TLS with its own certificate.
  termination: edge

# Only pods of this release may reach Postgres.
networkPolicy:
  enabled: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 512Mi }

nodeSelector: {}
tolerations: []
