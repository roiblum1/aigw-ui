{{- /*
Generated values are read back with lookup so an upgrade keeps them. A new
encryption key would make every stored kubeconfig unreadable, so the Secret is
also kept when the release is uninstalled.
*/ -}}
{{- if not .Values.auth.existingSecret }}
{{- $name := include "aigw-ui.authSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-token: {{ index $old "admin-token" | default (randAlphaNum 40 | b64enc) }}
  encryption-key: {{ index $old "encryption-key" | default (randBytes 32 | b64enc) }}
{{- end }}
{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "aigw-ui.name" .) }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Letters and digits only: the value is placed inside a connection URL.
  password: {{ index $old "password" | default (randAlphaNum 32 | b64enc) }}
{{- end }}
{{- if and .Values.redis.url (not .Values.redis.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aigw-ui.name" . }}-redis
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.redis.url | quote }}
{{- end }}
