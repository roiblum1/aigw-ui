{{- if .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "aigw-ui.name" .) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "aigw-ui.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels: {{- include "aigw-ui.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      {{- include "aigw-ui.pullSecrets" . | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ include "aigw-ui.image" (list .Values.global.imageRegistry .Values.postgresql.image "latest") }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: POSTGRESQL_DATABASE
              value: {{ .Values.postgresql.database | quote }}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}, key: password }
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/libexec/check-container", "--live"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext: {{- include "aigw-ui.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
spec:
  selector: {{- include "aigw-ui.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "aigw-ui.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "aigw-ui.selector" . | nindent 14 }}
              app.kubernetes.io/component: server
      ports:
        - port: 5432
{{- end }}
{{- end }}
