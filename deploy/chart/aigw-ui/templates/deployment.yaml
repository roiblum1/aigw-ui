{{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
{{- fail "set externalDatabase.existingSecret when postgresql.enabled is false" }}
{{- end }}
{{- $name := include "aigw-ui.name" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "aigw-ui.selector" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels: {{- include "aigw-ui.selector" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- if .Values.redis.url }}
      annotations:
        # Restart the pod when the Redis address changes.
        checksum/redis: {{ .Values.redis.url | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- include "aigw-ui.pullSecrets" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "aigw-ui.image" (list .Values.global.imageRegistry .Values.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "aigw-ui.authSecret" . }}, key: admin-token }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "aigw-ui.authSecret" . }}, key: encryption-key }
            {{- if .Values.postgresql.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}-postgresql, key: password }
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgresql.username }}:$(PGPASSWORD)@{{ $name }}-postgresql:5432/{{ .Values.postgresql.database }}?sslmode=disable"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.externalDatabase.existingSecret }}, key: url }
            {{- end }}
            - name: DISCOVERY_INTERVAL
              value: {{ .Values.config.discoveryInterval | quote }}
            - name: OVERAGE_INTERVAL
              value: {{ .Values.config.overageInterval | quote }}
            - name: OVERAGE_THRESHOLD
              value: {{ .Values.config.overageThreshold | quote }}
            - name: USAGE_HISTORY_INTERVAL
              value: {{ .Values.config.usageHistoryInterval | quote }}
            - name: TENANT_PAGE
              value: {{ .Values.config.tenantPage | quote }}
            - name: BEST_EFFORT_PRIORITY
              value: {{ .Values.config.bestEffortPriority | quote }}
            {{- if or .Values.redis.url .Values.redis.existingSecret }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.redis.existingSecret | default (printf "%s-redis" $name) }}, key: url }
            - name: REDIS_TLS_INSECURE
              value: {{ .Values.redis.tlsInsecure | quote }}
            - name: REDIS_ALLOW_RESET
              value: {{ .Values.redis.allowReset | quote }}
            - name: REDIS_KEY_PREFIX
              value: {{ .Values.redis.keyPrefix | quote }}
            {{- if or .Values.redis.caSecret .Values.redis.caConfigMap }}
            - name: REDIS_CA_FILE
              value: /etc/aigw-ui/redis-ca/ca.crt
            {{- end }}
            {{- end }}
            - name: SYNC_INTERVAL
              value: {{ .Values.config.syncInterval | quote }}
            - name: AUTO_SYNC
              value: {{ .Values.config.autoSync | quote }}
            {{- with .Values.fleet }}
            {{- if .domain }}
            - name: FLEET_DOMAIN
              value: {{ .domain | quote }}
            {{- end }}
            {{- if .peerSNI }}
            - name: FLEET_PEER_SNI
              value: {{ .peerSNI | quote }}
            {{- end }}
            - name: FLEET_PEER_CA_CONFIGMAP
              value: {{ .peerCAConfigMap | quote }}
            - name: FLEET_PEER_CLIENT_SECRET
              value: {{ .peerClientSecret | quote }}
            - name: FLEET_SESSION_HEADER
              value: {{ .sessionHeader | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "aigw-ui.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          {{- if or .Values.redis.caSecret .Values.redis.caConfigMap }}
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/aigw-ui/redis-ca
              readOnly: true
      volumes:
        - name: redis-ca
          {{- if .Values.redis.caSecret }}
          secret: { secretName: {{ .Values.redis.caSecret }} }
          {{- else }}
          configMap: { name: {{ .Values.redis.caConfigMap }} }
          {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "aigw-ui.labels" . | nindent 4 }}
spec:
  selector: {{- include "aigw-ui.selector" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
