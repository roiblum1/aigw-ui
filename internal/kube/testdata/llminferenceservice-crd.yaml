# A cut-down LLMInferenceService CRD for the tests that read capacity. It has
# the fields this tool reads, as KServe 0.21 defines them, and accepts any
# other field. The gateway CRDs are not here: hack/test-apiserver.sh installs
# the real ones.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llminferenceservices.serving.kserve.io
spec:
  group: serving.kserve.io
  scope: Namespaced
  names: {kind: LLMInferenceService, plural: llminferenceservices, singular: llminferenceservice}
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
