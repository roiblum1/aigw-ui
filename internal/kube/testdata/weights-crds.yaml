# Cut-down CRDs for the zone weight tests. They keep what the tests depend
# on: the paths the code reads and writes, and that weightedZones is a list
# keyed by zone, as in Envoy Gateway 1.8.5 (api/v1alpha1/loadbalancer_types.go).
# Everything else is left open. They are not the real CRDs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backendtrafficpolicies.gateway.envoyproxy.io
spec:
  group: gateway.envoyproxy.io
  scope: Namespaced
  names: {kind: BackendTrafficPolicy, plural: backendtrafficpolicies, singular: backendtrafficpolicy}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [targetRefs]
              x-kubernetes-preserve-unknown-fields: true
              properties:
                targetRefs:
                  type: array
                  items: {type: object, x-kubernetes-preserve-unknown-fields: true}
                loadBalancer:
                  type: object
                  required: [type]
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    type: {type: string}
                    zoneAware:
                      type: object
                      properties:
                        weightedZones:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys: [zone]
                          items:
                            type: object
                            required: [zone, weight]
                            properties:
                              zone: {type: string}
                              weight: {type: integer, format: int32}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llminferenceservices.serving.kserve.io
spec:
  group: serving.kserve.io
  scope: Namespaced
  names: {kind: LLMInferenceService, plural: llminferenceservices, singular: llminferenceservice}
  versions:
    - name: v1alpha2
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
