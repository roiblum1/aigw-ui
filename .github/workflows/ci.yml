# Tests every change, pushes the image to the GitHub Container Registry, and
# publishes a GitHub release for a version tag.
#
#   pull request     tests only
#   push to main     tests, then image tags "main" and "sha-<commit>"
#   tag v1.2.3       tests, then image tags "1.2.3" and "latest", and a GitHub
#                    release whose text is docs/release-notes/v1.2.3.md
#
# Every run fails when the version in the chart has no release note.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The store's tests run against a real Postgres, the same major version
    # the chart installs. Each test creates and drops a database of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Release note for the chart version
        run: hack/check-release-note.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l cmd internal docs)" || { gofmt -l cmd internal docs; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: No repeated code
        run: hack/check-duplication.sh

      # -race also finds two goroutines using the same value without a lock.
      - name: Unit tests and store tests
        run: go test -race ./...

      - name: The store tests did run
        run: |
          go test ./internal/store/ -run TestMigrationsApplyOnce -count=1 -v | grep -q -- "--- PASS: TestMigrationsApplyOnce"

      - name: Tests against a real Kubernetes API server
        run: hack/test-apiserver.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the UI
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Lint and render the chart
        run: hack/check-chart.sh

  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "list=$IMAGE:${GITHUB_REF_NAME#v},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:main,$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release with its release note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="$(hack/check-release-note.sh "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$note"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$note" --verify-tag
          fi
