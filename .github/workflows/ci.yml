# Tests every change, pushes the image to the GitHub Container Registry, and
# publishes a GitHub release for a version tag.
#
#   pull request     tests only
#   push to main     tests, then image tags "main" and "sha-<commit>", then an
#                    upgrade of the hub to that image when HUB_DEPLOY is "true"
#   tag v1.2.3       tests, then image tags "1.2.3" and "latest", and a GitHub
#                    release whose text is docs/release-notes/v1.2.3.md
#
# Both also push the AIPerf image, ghcr.io/<owner>/aigw-aiperf:<the AIPerf
# version in deploy/aiperf/Containerfile>, when that tag is not there yet.
#
# Every run fails when the version in the chart has no release note.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # After a merge, the tests and AIPerf run again only when main now holds
  # something no pull request run tested. A merge commit's second parent is
  # the pull request's head, on which that run left the tree it tested
  # (status ci/tested-tree, from the "tested" job below): when it is this
  # commit's tree, main did not move in between and the image is built at
  # once. A tag, or a merge after main moved, is tested again.
  seen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      tree: ${{ steps.look.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 2
      - id: look
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          head="$(git rev-parse --verify --quiet 'HEAD^2' || true)"
          if [ -z "$head" ]; then
            echo "not a merge commit: testing"
            exit 0
          fi
          tested="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/statuses" --jq '[.[] | select(.context == "ci/tested-tree")][0].description // ""')"
          if [ "$tested" = "$tree" ]; then
            echo "tree $tree was tested on the pull request's head $head: not testing again"
            echo "tree=$tree" >> "$GITHUB_OUTPUT"
          else
            echo "the pull request's run tested ${tested:-nothing recorded}, main holds $tree: testing"
          fi

  test:
    needs: seen
    if: needs.seen.outputs.tree == ''
    runs-on: ubuntu-latest
    # The store's tests run against a real Postgres, the same major version
    # the chart installs. Each test creates and drops a database of its own.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # For the usage package's test of the counters the history reads.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      USAGE_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Release note for the chart version
        run: hack/check-release-note.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - name: Market snapshot no older than 60 days, for a release
        if: github.ref_type == 'tag'
        run: hack/check-market.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l cmd internal docs)" || { gofmt -l cmd internal docs; exit 1; }

      - name: Vet
        run: go vet ./...

      # Unused code, deprecated calls and values never used, which vet does
      # not look for. Pinned, so a new release cannot fail an old commit.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: No repeated code
        run: hack/check-duplication.sh

      # -race also finds two goroutines using the same value without a lock.
      - name: Unit tests and store tests
        run: go test -race ./...

      - name: The store and usage tests did run
        run: |
          go test ./internal/store/ -run TestMigrationsApplyOnce -count=1 -v | grep -q -- "--- PASS: TestMigrationsApplyOnce"
          go test ./internal/usage/ -run TestHistoryCounters -count=1 -v | grep -q -- "--- PASS: TestHistoryCounters"

      - name: Tests against a real Kubernetes API server
        run: hack/test-apiserver.sh

      # The gateways in production may still be on the version before.
      - name: The same against the CRDs of Envoy AI Gateway 1.1.0
        run: ENVOY_GATEWAY_VERSION=v1.9.1 AI_GATEWAY_VERSION=v1.1.0 hack/test-apiserver.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the UI
        working-directory: web
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

      - name: Test the Claude Code plugin
        run: node --test clients/claude-code/scripts/ clients/aigw-token/

      - name: Lint and render the chart
        run: hack/check-chart.sh

  # A capacity measurement runs AIPerf on the LLM clusters. This builds the
  # image capacity.image is made from and runs the Job's script in it with
  # the real AIPerf, against a stand-in for vLLM, with no network.
  aiperf:
    needs: seen
    if: needs.seen.outputs.tree == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the AIPerf image
        run: docker build -t aigw-aiperf:test -f deploy/aiperf/Containerfile deploy/aiperf

      - name: The Job's script with the real AIPerf
        run: AIPERF_TEST_IMAGE=aigw-aiperf:test go test ./internal/capacity/ -run TestRealAIPerf -count=1 -v

  # On a pull request, once both passed: the tree this run tested. A pull
  # request from a fork has no right to note it, and is then tested again
  # after its merge.
  tested:
    if: github.event_name == 'pull_request'
    needs: [test, aiperf]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success -f context=ci/tested-tree -f description="$tree"

  image:
    # Also when the tests were not run again (seen): skipped is not failed.
    if: github.event_name == 'push' && !cancelled() && !failure()
    needs: [seen, test, aiperf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "list=$IMAGE:${GITHUB_REF_NAME#v},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:main,$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image capacity.image is set to. It is tagged with the AIPerf
      # version it holds, not the hub's, because a hub of any version runs
      # the same Job script on it. It is built only when that tag is not in
      # the registry yet: a change to the Containerfile that should reach
      # the clusters raises AIPERF_VERSION.
      - name: AIPerf image tag
        id: aiperf
        run: |
          version="$(sed -n 's/^ARG AIPERF_VERSION=//p' deploy/aiperf/Containerfile)"
          test -n "$version"
          tag="ghcr.io/${{ github.repository_owner }}/aigw-aiperf:$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
            echo "$tag is in the registry already"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.aiperf.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: deploy/aiperf
          file: deploy/aiperf/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.aiperf.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aiperf
          cache-to: type=gha,scope=aiperf,mode=max

  # Upgrades one hub to the image that was just pushed. It runs only when
  # the repository variable HUB_DEPLOY is "true". The account it uses is in
  # the secrets of the environment "hub": see docs/operations.md.
  deploy:
    # An if without a status check means success() of every job before it,
    # and the tests skipped after a merge (seen) count as not successful:
    # the hub was not upgraded after 0.28.0 and 0.29.0. The image is what
    # matters here.
    if: >-
      !cancelled() && needs.image.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HUB_DEPLOY == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: hub
    # One upgrade at a time, in the order of the commits. A running upgrade
    # is never cut off halfway.
    concurrency:
      group: deploy-hub
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade the hub
        env:
          HUB_SERVER: ${{ secrets.HUB_SERVER }}
          HUB_TOKEN: ${{ secrets.HUB_TOKEN }}
          HUB_CA: ${{ secrets.HUB_CA }}
          HUB_NAMESPACE: ${{ vars.HUB_NAMESPACE }}
          HUB_RELEASE: ${{ vars.HUB_RELEASE }}
        run: IMAGE_TAG="sha-${GITHUB_SHA::12}" hack/deploy-hub.sh

  release:
    if: "!cancelled() && needs.image.result == 'success' && github.ref_type == 'tag'"
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the release with its release note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          note="$(hack/check-release-note.sh "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$note"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$note" --verify-tag
          fi
